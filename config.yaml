# 변압기 열적 노화·냉각 이상 진단 — 결정값 모음
# 모든 숫자는 여기에만 둔다. 코드에 숫자를 흩어두지 않는다.
# status: 확정 = 본인 결정 완료 / 가정 = 근거 확보 전 임시값 (외부에 수치로 인용하지 말 것)

# ── 가 묶음: 변압기 자체 ─────────────────────────────────────
transformer:                       # D1 — 확정 (2026.09.28)
  description: 154kV 수전 주변압기, ONAN/ONAF 겸용
  reason: 팹·데이터센터 수전 모두 해당. 팬 고장을 ONAF→ONAN 전환으로 모사할 수 있음
  rating_onaf_mva: 60              # 가정 — 명판 예시 확보 필요
  onan_to_onaf_ratio: 0.75         # 가정 — 팬 없이 낼 수 있는 정격 비율. 명판 예시 확보 필요

insulation:                        # D6 — 확정
  paper: kraft                     # 일반 크라프트지 (비열적개량지)
  reference_hotspot_c: 98          # V=1이 되는 최고점 온도
  doubling_k: 6                    # 6K 오를 때마다 노화율 2배
  reason: 규격 식이 가장 단순하고 널리 인용됨

# 규격 파라미터 — IEC 60076-7 대형 전력용 변압기 (2026.09.28 교차 확인, 원문 미열람)
# 확인 근거
#   [P] IEC 60076-7:2005 공식 미리보기(서문): ON 냉각에서 x=0.8, y=1.3
#   [A] Alliander(네덜란드 배전사업자) 오픈소스 'transformer-thermal-model' v0.6.0 — IEC 60076-7 구현체
#       전력용 ONAN: τo 210, τw 10 / ONAF: τo 150, τw 7 / k11 0.5, k21 2, k22 2, x 0.8, y 1.3, H 1.3
#       차분방정식 구조(유온 k11·τo, 권선 k22·τw, 유 성분 τo/k22)도 본 코드와 동일
#   [KS] KS C IEC 60076-7 존재 확인 (e나라표준인증, 2026.09.28): 2008-11-20 제정, IDT(일치),
#        최종 확인 2023-12-14. 대응 판은 'IEC 60076-7 Ed. 2.0'으로 표기되나 제정 이후 개정 없이 '확인'만
#        이어져 2005판(Ed.1.0) 내용일 가능성 있음 — 원문 열람 전 미확정. 한글 표준명은 '성능시험 지침'으로
#        되어 있으나 적용범위는 부하·주위온도가 수명에 미치는 영향(= 부하 지침)
#        원문 무료 열람은 e나라에서 제공되지 않음(고시문만). KSSN 구매·도서관 열람 필요
# 미확인: d_theta_or 52, d_theta_hr 26, R 6 — 정격 시 최고점 98℃가 되도록 맞춘 값.
#   실제로는 변압기마다 온도상승시험 결과(명판)로 정해지는 값이지 규격 상수가 아님.
#   [A]의 기본값은 유온 상승 60K, 권선-유 온도차 17K×H1.3 → 정격 최고점 약 102℃
thermal_params:
  source: "x, y, τo, τw, k11, k21, k22 = [P][A] 교차 확인 / d_theta_or, d_theta_hr, R = 미확인(변압기별 값)"
  status: 부분 확인
  ambient_rated_c: 20
  ONAN:
    x: 0.8          # 유온 지수
    y: 1.3          # 권선 지수
    R: 6            # 부하손/무부하손 — 미확인, 변압기별 값
    d_theta_or: 52  # 정격 시 최상부 유온 상승 [K] — 미확인, 변압기별 값
    d_theta_hr: 26  # 정격 시 최고점-최상부 유온 차 [K] — 미확인, 변압기별 값
    tau_o_min: 210  # 유 시정수 [분]
    tau_w_min: 10   # 권선 시정수 [분]
    k11: 0.5
    k21: 2.0
    k22: 2.0
  ONAF:
    x: 0.8
    y: 1.3
    R: 6
    d_theta_or: 52
    d_theta_hr: 26
    tau_o_min: 150
    tau_w_min: 7
    k11: 0.5
    k21: 2.0
    k22: 2.0

fan_control:                       # D8 — 방식 확정, 온도값은 가정
  basis: top_oil                   # 유온 기준으로 켜고 끔
  on_c: 65                         # 가정
  off_c: 55                        # 가정 — 켜는 값과 간격(히스테리시스)을 둬서 경계 반복 방지
  reason: 현장 냉각팬은 보통 유온 스위치로 동작

simulation:
  dt_min: 1        # 내부 계산 간격. 입력은 1시간 단위지만 권선 시정수(7~10분) 때문에 잘게 쪼갬
  reason: 차분방정식은 계산 간격이 가장 짧은 시정수의 절반 이하여야 안정

# ── 나 묶음: 운전 조건 ─────────────────────────────────────
weather:                           # D3 — 확정
  station: 이천(203)
  file: data/ambient_icheon_2023_2025.csv
  years: [2023, 2024, 2025]
  reason: 선선한 해(2023)와 더운 해(2024·2025)가 섞여 연도 비교와 학습/시험 분리가 가능

load_profile:                      # D2 — 확정 (2026.09.28): 두 가지를 모두 쓴다
  file: data/load_profiles.csv
  scale_basis: p99                 # 가정 — 부하 곡선을 '상위 1% 값 = 1.0'으로 정규화. 실험에서 이 1.0을 목표 부하율로 늘리고 줄임
  scale_reason: 최댓값 기준은 순간 튀는 값 하나에 끌려감. 평균 기준은 '부하율 50%' 같은 운전 기준(보통 최대부하 기준)과 맞지 않음
  etth2:
    source: data/ETTh2.csv
    column: HUFL
    reason: 실측 부하 곡선. 무슨 부하인지는 모름 — 모양(하루·계절 변화)만 빌려온다
    bad_value_rule: 0 이하 값(계측 누락) + 2017-04-17 12시~04-19 19시 급증 구간을 이상 구간으로 보고, 7일 전 같은 시각 값으로 대체
    event_start: "2017-04-17 12:00"
    event_end: "2017-04-19 19:00"
    event_reason: 평소의 약 2.7배가 사흘간 지속. 원인 불명(다른 선로 부하 절체로 추정되나 확인 불가). 남기면 봄철 과부하 하나가 수명 소모를 지배함
    year_mapping: "2023·2025 ← 2016.07~2017.06, 2024 ← 2017.07~2018.06 (같은 월·일·시). 계절 흐름은 유지, 요일은 무시(요일별 차이 0.6 이내로 확인)"
  datacenter:
    reason: IT 부하는 거의 평탄. 다만 변압기는 냉각 설비 부하도 같이 받으므로 외기가 오르면 전체 부하도 오른다
    model: 부하 = IT(일정) × PUE(외기)
    pue_low: 1.25                  # 가정 — 외기 10℃ 이하
    pue_high: 1.50                 # 가정 — 외기 30℃ 이상, 그 사이는 직선
    t_low_c: 10
    t_high_c: 30
    note: pue_low = pue_high 로 두면 완전 평탄 부하가 된다

# 아래는 해당 단계 직전에 결정
# indoor:         D7
# exp1_criteria:  D11
# fault:          D4, D4-2
# sensor:         D10
# detectors:      D5, D9, D12
